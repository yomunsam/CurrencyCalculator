name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore Src/CurrencyCalculator.slnx

      - name: Setup Node.js for regression checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify event, offline, and rate boundaries
        run: |
          node --test Tests/Interactions/*.test.mjs Tests/Pwa/*.test.mjs
          dotnet run --project Tests/Core/ExpressionChecks.csproj
          dotnet run --project Tests/Pwa/RateChecks.csproj

      - name: Publish
        run: dotnet publish Src/CurrencyCalculator.Web/CurrencyCalculator.Web.csproj -c Release -o publish

      - name: Prepare subpath and verify offline artifact integrity
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          BASE_PATH="/"
          if [[ "$REPO_NAME" != *.github.io ]]; then
            BASE_PATH="/$REPO_NAME/"
          fi
          node .github/scripts/pwa-artifacts.mjs publish/wwwroot "$BASE_PATH"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
